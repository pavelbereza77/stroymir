  solr:
    image: solr:8.11.2
    
    container_name: solr
    ports:
      - "8983:8983"

    # 👉 Правильно настраиваем монтирование
    volumes:
      - ./oscar_config:/opt/solr-8.11.2/server/solr/configsets/oscar-config
      - ./solr_data:/opt/solr-8.11.2/server/solr

    # 👉 Только heap, остальное не трогаем
    environment:
      SOLR_HEAP: "512m"

    # 👉 Запускаем только сервер
    # command: solr-precreate oscar_stroymir oscar-config
    command: solr-precreate oscar_stroymir /opt/solr/server/solr/configsets/oscar-config

